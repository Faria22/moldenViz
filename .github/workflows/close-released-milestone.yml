name: Close released milestone

on:
  release:
    types: [published]

permissions:
  issues: write

jobs:
  close-milestone:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest

    steps:
      - name: Close matching milestone
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          version="${RELEASE_TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Skipping non-semantic release tag ${RELEASE_TAG}."
            exit 0
          fi

          milestone_title="v${version%.*}"
          milestone_number="$(
            gh api --paginate \
              "repos/${REPOSITORY}/milestones?state=open&per_page=100" |
              jq --slurp --raw-output --arg title "$milestone_title" \
                'add | map(select(.title == $title)) | first | .number // empty'
          )"

          if [[ -z "$milestone_number" ]]; then
            echo "No open milestone named ${milestone_title}; nothing to close."
            exit 0
          fi

          gh api --method PATCH \
            "repos/${REPOSITORY}/milestones/${milestone_number}" \
            -f state=closed
